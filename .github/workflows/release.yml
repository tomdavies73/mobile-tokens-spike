name: Release mobile tokens

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-swift-tokens
  cancel-in-progress: false

jobs:
  android:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate tokens
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android AAR
        run: gradle --no-daemon :android-tokens:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-tokens-aar
          path: android-tokens/build/outputs/aar/android-tokens-release.aar
          if-no-files-found: error

  release:
    needs: android
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be SemVer x.y.z, without a v prefix" >&2
            exit 1
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build tokens and release manifest
        run: |
          npm ci
          npm run build
          npm run generate:package -- --name MobileTokens --ios-min-version 13 --macos-min-version 10.15
          swift package dump-package >/dev/null
          swift build

      - name: Create release-only commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Package.swift dist/ios/
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - uses: actions/download-artifact@v4
        with:
          name: android-tokens-aar
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release-assets/android-tokens-release.aar --verify-tag --generate-notes --title "$RELEASE_TAG"
