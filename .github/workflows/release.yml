name: Release Swift tokens

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-swift-tokens
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be SemVer x.y.z, without a v prefix" >&2
            exit 1
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build tokens and release manifest
        run: |
          npm ci
          npm run build
          npm run generate:package -- --name MobileTokens --ios-min-version 13
          swift package dump-package >/dev/null
          swift build

      - name: Create release-only commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Package.swift dist/ios/
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
